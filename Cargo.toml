[workspace]
resolver = "3"
exclude = ["_old", "apps/slint-shell/vendor/i-slint-core"]
members = [
    "crates/lhc-core",
    "apps/slint-shell",
    "apps/slint-shell/vendor/spell-framework",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"

[workspace.dependencies]
evdev = "0.13"
libc = "0.2"
wayland-client = "0.31"
zbus = "5"
tempfile = "3"
dirs = "6"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[patch.crates-io]
i-slint-core = { path = "apps/slint-shell/vendor/i-slint-core" }
