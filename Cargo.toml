[workspace]
resolver = "2"
members = [
    "crates/lhc-core",
    "src-tauri",
    "apps/slint-shell",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"

[workspace.dependencies]
dirs = "6"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[patch.crates-io]
i-slint-core = { path = "apps/slint-shell/vendor/i-slint-core" }
