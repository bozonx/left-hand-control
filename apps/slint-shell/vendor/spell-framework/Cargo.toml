[package]
name = "spell-framework"
version = "1.0.6"
edition = "2024"
description = "Make desktop widgets by the Mystic Arts of Spell"
license = "GPL-3.0-or-later"
repository = "https://github.com/VimYoung/Spell"
keywords = ["widget", "rice", "spell", "slint", "wayland"]
exclude = ["/src/bin/*"]
homepage = "https://vimyoung.github.io/Spell/"

# Local change: upstream doctests reference the published crate layout and
# do not build from this vendored copy inside the application workspace.
[lib]
doctest = false

[dependencies]
# env_logger = "0.11.7"
# fs2 = "0.4.3"
i-slint-core = { version = "=1.18.1", default-features = false }
# i-slint-renderer-skia = { version = "1.15.1", features = [
#   "wayland",
# ], optional = true }
i-slint-renderer-skia = { version = "=1.18.1", default-features = false, optional = true }
# signal-hook = "0.4.3"
slint = { version = "=1.18.1", default-features = false, features = ["renderer-skia", "compat-1-2"] }
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = [
  "xkbcommon",
  "calloop",
] }
# Local change: no subscriber is installed here, so events reach the application's `log` logger.
tracing = { version = "0.1.44", features = ["log"] }
# tracing-rfc-5424 = "0.2.0"
# zbus = {version = "5.10.0", default-features=false, features=["blocking-api"]}
wl-clipboard-rs = "0.9.3"

# Local change: the application release (cargo-release) must not bump this crate.
[package.metadata.release]
release = false

[package.metadata.docs.rs]
no-default-features = true
features = ["docs-only"]

[features]
default = ["i-slint-renderer-skia", "slint"]
docs-only = []
slint = ["i-slint-renderer-skia"]
