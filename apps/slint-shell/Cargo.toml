[package]
name = "slint-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# cargo-release (see release.toml): the application package owns the release tag
# and the dated CHANGELOG and AppStream entries.
[package.metadata.release]
tag = true
tag-name = "v{{version}}"
pre-release-replacements = [
    { file = "../../CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}", exactly = 1 },
    { file = "packaging/linux/dev.bozonx.left-hand-control.metainfo.xml", search = "<releases>", replace = "<releases>\n    <release version=\"{{version}}\" date=\"{{date}}\">\n      <url type=\"details\">https://github.com/bozonx/left-hand-control/releases/tag/v{{version}}</url>\n    </release>", exactly = 1 },
]
# A dry run leaves the files unchanged, so the check would see the old version.
pre-release-hook = ["sh", "-c", "[ \"$DRY_RUN\" = true ] || python3 scripts/release-metadata.py v{{version}}"]

[[bin]]
name = "left-hand-control"
path = "src/main.rs"

[dependencies]
lhc-core = { path = "../../crates/lhc-core" }
slint = { version = "=1.18.1", default-features = false, features = ["std", "accessibility", "compat-1-2", "backend-winit", "renderer-software", "renderer-skia", "unstable-winit-030"] }
i-slint-core = { version = "=1.18.1", default-features = false, features = ["tr"] }
tr = { version = "0.1.11", default-features = false, features = ["mo-translator"] }
serde.workspace = true
serde_json.workspace = true
log.workspace = true
env_logger = "0.11"
png = "0.18"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.6", features = ["blocking"] }
evdev.workspace = true
raw-window-handle = "0.6"
wayland-client.workspace = true
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
global-hotkey = "0.8"
dirs.workspace = true
# 0.24 shares muda 0.19 with the Slint winit backend; 0.25+ adds a second muda.
tray-icon = "0.24"

[target.'cfg(target_os = "macos")'.dependencies]
enigo = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Security_Cryptography", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[features]
spell = ["dep:spell-framework"]
# Diagnostic stands for the benchmark scripts: KWin focus probe and a
# virtual test keyboard.
probes = ["spell", "dep:zbus", "dep:tempfile", "dep:wayland-protocols-plasma"]

[target.'cfg(target_os = "linux")'.dependencies.spell-framework]
path = "vendor/spell-framework"
optional = true

[target.'cfg(target_os = "linux")'.dependencies.zbus]
workspace = true
optional = true

[target.'cfg(target_os = "linux")'.dependencies.tempfile]
workspace = true
optional = true

[build-dependencies]
rspolib = "0.1.2"
slint-build = "=1.18.1"

[[example]]
name = "bench-evdev"
required-features = ["spell"]

[[example]]
name = "bench-return"
required-features = ["probes"]

[[example]]
name = "inspect-geometry"
required-features = ["probes"]

[[example]]
name = "panel-fixture"
required-features = ["spell"]

[[example]]
name = "focus-window"
required-features = ["probes"]

[target.'cfg(target_os = "linux")'.dependencies.wayland-protocols-plasma]
version = "0.3"
features = ["client"]
optional = true

[dev-dependencies]
tempfile.workspace = true
