[package]
name = "slint-shell"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
lhc-core = { path = "../../crates/lhc-core" }
slint = { version = "=1.17.1", default-features = false, features = ["std", "accessibility", "compat-1-2", "backend-winit", "renderer-software", "renderer-femtovg", "renderer-skia", "unstable-winit-030"] }
i-slint-core = { version = "=1.17.1", default-features = false, features = ["tr"] }
tr = { version = "0.1.11", default-features = false, features = ["mo-translator"] }
serde.workspace = true
serde_json.workspace = true
log.workspace = true
env_logger = "0.11"
png = "0.17"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.6", features = ["blocking"] }
evdev = "0.13"
raw-window-handle = "0.6"
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
global-hotkey = "0.8"
dirs.workspace = true
tray-icon = "0.25"

[target.'cfg(target_os = "macos")'.dependencies]
enigo = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[features]
spell = ["dep:spell-framework"]
# Diagnostic stands for the benchmark scripts: KWin focus probe and a
# virtual test keyboard.
probes = ["spell", "dep:zbus", "dep:tempfile", "dep:wayland-protocols-plasma"]

[target.'cfg(target_os = "linux")'.dependencies.spell-framework]
path = "vendor/spell-framework"
optional = true

[target.'cfg(target_os = "linux")'.dependencies.zbus]
version = "5"
optional = true

[target.'cfg(target_os = "linux")'.dependencies.tempfile]
version = "3"
optional = true

[build-dependencies]
rspolib = "0.1.2"
slint-build = "=1.17.1"

[[example]]
name = "bench-evdev"
required-features = ["spell"]

[[example]]
name = "bench-return"
required-features = ["probes"]

[[example]]
name = "inspect-geometry"
required-features = ["probes"]

[[example]]
name = "panel-fixture"
required-features = ["spell"]

[[example]]
name = "focus-window"
required-features = ["probes"]

[target.'cfg(target_os = "linux")'.dependencies.wayland-protocols-plasma]
version = "0.3"
features = ["client"]
optional = true

[dev-dependencies]
tempfile = "3"
