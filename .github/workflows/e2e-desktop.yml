name: Desktop E2E

on:
  workflow_dispatch:
    inputs:
      target:
        description: E2E target to run
        required: true
        default: kde-wayland
        type: choice
        options:
          - kde-wayland
          - windows

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: true

jobs:
  kde-wayland:
    if: inputs.target == 'kde-wayland'
    name: Manjaro KDE Plasma Wayland
    runs-on: [self-hosted, linux, manjaro, kde, wayland]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run Slint editor smoke test
        run: cargo run --locked -p slint-shell --features spell --example editor -- --smoke

      - name: Run Slint interactions
        run: cargo run --locked -p slint-shell --features spell --example interactions

      - name: Run Slint library scenario
        run: cargo run --locked -p slint-shell --features spell --example library

      - name: Build Slint shell
        run: cargo build --locked -p slint-shell --features spell

      - name: Check configuration and popup worker recovery
        run: python3 apps/slint-shell/scripts/check-recovery.py --popups spell

  windows:
    if: inputs.target == 'windows'
    name: Windows Desktop
    runs-on: [self-hosted, windows, windows-11]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run Slint Windows automated acceptance
        shell: powershell
        run: .\apps\slint-shell\scripts\check-windows-automated.ps1

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-windows
          path: |
            windows-runtime/lifecycle/
