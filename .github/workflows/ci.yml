name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    name: Slint / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: slint

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build libdbus-1-dev libfontconfig1-dev libwayland-dev libxkbcommon-dev

      - name: Test Linux shell (Spell)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --locked -p slint-shell --features spell --all-targets

      - name: Clippy Linux shell (Spell)
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --locked -p slint-shell --features spell --all-targets --no-deps -- -D warnings

      - name: Check Linux shell without Spell
        if: matrix.os == 'ubuntu-latest'
        run: cargo check --locked -p slint-shell --all-targets

      - name: Test portable shell
        if: matrix.os != 'ubuntu-latest'
        run: cargo test --locked -p slint-shell --all-targets

      - name: Clippy portable shell
        if: matrix.os != 'ubuntu-latest'
        run: cargo clippy --locked -p slint-shell --all-targets --no-deps -- -D warnings

      - name: Check portable release
        if: matrix.os != 'ubuntu-latest'
        run: cargo check --release --locked -p slint-shell

  frontend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    name: Frontend / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check system macros sync
        run: node scripts/check-system-macros-sync.mjs

      - name: Audit dependencies
        run: pnpm audit --audit-level high
        continue-on-error: true

      - name: Run unit tests
        run: pnpm test:unit

      - name: Run component tests
        run: pnpm test:components

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/**/*.xml

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

      - name: Type check
        run: pnpm typecheck

      - name: Build frontend (nuxt generate)
        run: pnpm generate

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    name: Rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: core-tauri

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev libssl-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      # lhc-core is shared by both shells; test and lint it with Tauri.
      - name: Run cargo test
        run: cargo test --locked -p lhc-core -p left-hand-control --all-features

      - name: Run cargo clippy
        run: cargo clippy --locked -p lhc-core -p left-hand-control --all-features --all-targets --no-deps -- -D warnings

      - name: Audit Rust dependencies
        if: matrix.os == 'ubuntu-latest'
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  tauri-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    name: Tauri Smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev libssl-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Install Node deps
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm generate

      - name: Build Tauri (release)
        run: pnpm tauri build
        env:
          NO_STRIP: true
