name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    name: Slint / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.1  # keep in sync with rust-toolchain.toml
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: slint

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build libfontconfig1-dev libwayland-dev libxkbcommon-dev weston

      - name: Check formatting
        run: cargo fmt -p lhc-core -p slint-shell --check

      - name: Check Windows script syntax (no desktop)
        if: matrix.os == 'windows-latest'
        run: powershell -NoProfile -File apps/slint-shell/scripts/windows/check-windows-syntax.ps1

      - name: Test VM controllers and release gates (no desktop)
        if: matrix.os == 'ubuntu-latest'
        run: python3 -m unittest discover -s apps/slint-shell/scripts/vm -p 'test_*.py'

      - name: Test Linux shell (Spell)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --locked --workspace --features slint-shell/spell --all-targets

      - name: Build UI scenarios
        if: matrix.os == 'ubuntu-latest'
        run: >-
          cargo build --locked --profile test -p slint-shell --features spell
          --example editor --example interactions --example library --example action-picker --example macros --example menus --example conditions --example popup-grid --example undo-redo --example inline-edit --example drag-scroll --example notifications --example accessibility --example keyboard-navigation --example contrast-scaling --example layer-keys --example small-window

      - name: Run UI scenarios (headless Wayland)
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 25
        shell: bash
        env:
          SLINT_BACKEND: winit-software
          WINIT_UNIX_BACKEND: wayland
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          export WAYLAND_DISPLAY=wayland-ci
          export LHC_DEV_DIR="$XDG_RUNTIME_DIR/lhc"
          weston --backend=headless --renderer=pixman --socket="$WAYLAND_DISPLAY" \
            --width=1600 --height=1000 --idle-time=0 --no-config \
            --log="$XDG_RUNTIME_DIR/weston.log" &
          weston_pid=$!
          cleanup() {
            kill "$weston_pid" 2>/dev/null || true
            wait "$weston_pid" 2>/dev/null || true
            cat "$XDG_RUNTIME_DIR/weston.log"
            rm -rf -- "$XDG_RUNTIME_DIR"
          }
          trap cleanup EXIT
          for attempt in {1..100}; do
            [ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ] && break
            kill -0 "$weston_pid"
            sleep 0.1
          done
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
          timeout --kill-after=5s 90s target/debug/examples/editor --smoke
          # Keep in sync with apps/slint-shell/scripts/e2e-local.sh.
          for example in interactions library action-picker macros menus conditions popup-grid undo-redo inline-edit drag-scroll notifications accessibility keyboard-navigation contrast-scaling layer-keys small-window; do
            timeout --kill-after=5s 90s "target/debug/examples/$example"
          done

      - name: Clippy Linux shell (Spell)
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --locked -p lhc-core -p slint-shell --features slint-shell/spell --all-targets --no-deps -- -D warnings

      - name: Check Linux shell without Spell
        if: matrix.os == 'ubuntu-latest'
        run: cargo check --locked -p slint-shell --all-targets

      - name: Test portable shell
        if: matrix.os != 'ubuntu-latest'
        run: cargo test --locked -p lhc-core -p slint-shell --all-targets

      - name: Clippy portable shell
        if: matrix.os != 'ubuntu-latest'
        run: cargo clippy --locked -p lhc-core -p slint-shell --all-targets --no-deps -- -D warnings

      - name: Check portable release
        if: matrix.os != 'ubuntu-latest'
        run: cargo check --release --locked -p slint-shell

  msrv:
    name: MSRV (rust-version)
    runs-on: ubuntu-latest
    env:
      # Overrides rust-toolchain.toml; keep in sync with rust-version in Cargo.toml.
      RUSTUP_TOOLCHAIN: "1.92"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.92"

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: msrv

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build libfontconfig1-dev libwayland-dev libxkbcommon-dev

      - name: Check
        run: cargo check --locked -p lhc-core -p slint-shell --features slint-shell/spell

  mapper-e2e:
    name: Mapper e2e (uinput)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.1  # keep in sync with rust-toolchain.toml

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: mapper-e2e

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev

      - name: Enable uinput
        id: uinput
        run: |
          if sudo modprobe uinput && [ -c /dev/uinput ]; then
            sudo chmod 0666 /dev/uinput
            sudo usermod -aG input "$USER"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::uinput is unavailable on this runner; mapper e2e is local-only"
          fi

      - name: Mapper e2e
        if: steps.uinput.outputs.available == 'true'
        # sg picks up the input group without a new login, for reading /dev/input.
        run: sg input -c "cargo test --locked -p lhc-core --test mapper_e2e -- --ignored"

  deny:
    name: Rust dependency check (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Advisories (RustSec), licences, banned/duplicate crates and sources; see deny.toml.
      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
