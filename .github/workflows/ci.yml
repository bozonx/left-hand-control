name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    name: Slint / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: slint

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build libdbus-1-dev libfontconfig1-dev libwayland-dev libxkbcommon-dev

      - name: Check formatting
        run: cargo fmt -p lhc-core -p slint-shell --check

      - name: Test Linux shell (Spell)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --locked --workspace --features slint-shell/spell --all-targets

      - name: Clippy Linux shell (Spell)
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --locked -p lhc-core -p slint-shell --features slint-shell/spell --all-targets --no-deps -- -D warnings

      - name: Check Linux shell without Spell
        if: matrix.os == 'ubuntu-latest'
        run: cargo check --locked -p slint-shell --all-targets

      - name: Test portable shell
        if: matrix.os != 'ubuntu-latest'
        run: cargo test --locked -p lhc-core -p slint-shell --all-targets

      - name: Clippy portable shell
        if: matrix.os != 'ubuntu-latest'
        run: cargo clippy --locked -p lhc-core -p slint-shell --all-targets --no-deps -- -D warnings

      - name: Check portable release
        if: matrix.os != 'ubuntu-latest'
        run: cargo check --release --locked -p slint-shell

  audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit Rust dependencies
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
