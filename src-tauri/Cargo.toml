[package]
name = "left-hand-control"
version = "0.2.0"
description = "Left Hand Control desktop app"
authors = ["Ivan Kolesnikov <ivan@bozonx.com>"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "left_hand_control_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lhc-core = { path = "../crates/lhc-core" }
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
