# cargo-deny: security advisories, licences, duplicate/banned crates and sources.
# Run: cargo deny check

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
all-features = true

[advisories]
# Vulnerabilities fail for any crate. Unmaintained notices fail only for direct
# dependencies: transitive ones (zbus 5 internals, ttf-parser via winit) wait for
# Slint and its stack to move on.
unmaintained = "workspace"
ignore = []

[licenses]
# Every licence must be compatible with the project's GPL-3.0-or-later.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# Workspace crates are not published.
ignore = true

[bans]
# Slint, wgpu and winit bring several duplicated versions we cannot unify;
# report them without failing.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
