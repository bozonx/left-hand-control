[package]
name = "lhc-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
dirs.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
evdev.workspace = true
libc.workspace = true
nix = { version = "0.29", features = ["poll", "event"] }
reis = "0.6.1"
wayland-client.workspace = true
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
zbus.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSRunningApplication", "NSWorkspace"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFCGTypes", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGDirectDisplay", "CGError", "CGGeometry", "CGWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSBundle", "NSEnumerator", "NSString", "NSURL"] }

[dev-dependencies]
tempfile.workspace = true
