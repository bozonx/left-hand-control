[package]
name = "lhc-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
dirs.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.12"
libc = "0.2"
nix = { version = "0.29", features = ["poll", "event"] }
reis = "0.6.1"
zbus = "5"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
