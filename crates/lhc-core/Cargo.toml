[package]
name = "lhc-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
dirs.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
serde_yaml = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.12"
libc = "0.2"
nix = { version = "0.29", features = ["poll", "event"] }
reis = "0.6.1"
zbus = "5"

[dev-dependencies]
tempfile = "3"
