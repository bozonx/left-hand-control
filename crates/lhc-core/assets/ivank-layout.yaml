      KeyW: { name: Present windows, action: kde:kwin/Expose }
      KeyE: { name: Grid view, action: kde:kwin/Grid View }
      KeyR: { name: Show desktop, action: kde:kwin/Show Desktop }
      KeyT: { name: Keep above, action: kde:kwin/Window Above Other Windows }
      KeyA: { name: Maximize, action: kde:kwin/Window Maximize }
      KeyS: { name: Minimize, action: kde:kwin/Window Minimize }
      KeyD: { name: Fullscreen, action: kde:kwin/Window Fullscreen }
      KeyF: { name: Close window, action: kde:kwin/Window Close }
      KeyG: { name: Edit tiles, action: kde:kwin/Edit Tiles }
      KeyZ: { name: Lock screen, action: kde:ksmserver/Lock Session }
      KeyX: { name: Screen off, action: kde:org_kde_powerdevil/Turn Off Screen }
