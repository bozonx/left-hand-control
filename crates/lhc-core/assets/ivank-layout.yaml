      KeyR: { name: Mute, action: kde:kmix/mute }
      KeyT: { name: Mute microphone, action: kde:kmix/mic_mute }
      KeyA: { name: Screenshot region, action: kde:org.kde.spectacle.desktop/RectangularRegionScreenShot }
      KeyS: { name: Screenshot window, action: kde:org.kde.spectacle.desktop/ActiveWindowScreenShot }
      KeyD: { name: Screenshot screen, action: kde:org.kde.spectacle.desktop/FullScreenScreenShot }
      KeyF: { name: Record region, action: kde:org.kde.spectacle.desktop/RecordRegion }
      KeyG: { name: Clipboard history, action: kde:plasmashell/show-on-mouse-pos }
      KeyZ: { name: KRunner, action: kde:org.kde.krunner.desktop/_launch }
      KeyX: { name: App launcher, action: kde:plasmashell/activate application launcher }
      KeyC: { name: Terminal, action: kde:org.kde.konsole.desktop/_launch }
