layers:
  - id: navigation
    keys:
      MetaLeft: Ctrl+KeyX
      AltLeft: Delete
      Space: Backspace

      KeyQ: macro:moveLineDown
      KeyW: Ctrl+Backspace
      KeyE: Ctrl+Delete
      KeyR: macro:pasteAtLineAbove
      KeyT: Ctrl+Home
      KeyY: Home
      KeyU: macro:downEnd
      KeyI: macro:upEnd
      KeyO: End
      KeyP: macro:up5Times
      BracketLeft: null

      KeyA: app:showEmojiMenu1
      KeyS: macro:duplicateLine
      KeyD: Ctrl+KeyD
      KeyF: macro:cutLineContent
      KeyG: macro:copyLine
      KeyH: ArrowLeft
      KeyJ: ArrowDown
      KeyK: ArrowUp
      KeyL: ArrowRight
      Semicolon: macro:rightSpace
      Quote: null

      KeyZ: macro:emptyLineBelow
      KeyX: macro:cutWordRightCenter
      KeyC: macro:copyWordAfterCenter
      KeyV: macro:pasteAtLineBottom
      KeyB: Ctrl+End
      KeyN: Ctrl+ArrowLeft
      KeyM: macro:downHome
      Comma: macro:upHome
      Period: Ctrl+ArrowRight
      Slash: macro:down5Times
  - id: select
    keys:
      CapsLock: null
      AltLeft: Ctrl+Enter

      Digit1: sys:switchLayout1
      Digit2: sys:switchLayout2
      Digit3: sys:switchLayout3
      Digit4: sys:switchLayout4
      Digit5: sys:switchLayout5
      Digit6: sys:switchLayout6
      Digit7: sys:switchLayout7
      Digit8: sys:switchLayout8
      Digit9: sys:switchLayout9
      Digit0: sys:switchLayout10

      KeyQ: Ctrl+KeyZ
      KeyW: macro:cutToStart
      KeyE: macro:cutToEnd
      KeyR: null
      KeyT: null
      KeyY: Shift+Home
      KeyU: PageDown
      KeyI: PageUp
      KeyO: Shift+End
      KeyP: macro:select5LinesUp
      BracketLeft: null

      KeyA: Ctrl+Slash
      KeyS: macro:copyToStart
      KeyD: macro:copyToEnd
      KeyF: macro:cutAndRemoveLine
      KeyG: macro:selectWholeLine
      KeyH: Shift+ArrowLeft
      KeyJ: Shift+ArrowDown
      KeyK: Shift+ArrowUp
      KeyL: Shift+ArrowRight
      Semicolon: macro:selectWordRightCenter
      Quote: null

      KeyZ: null
      KeyX: macro:replaceToStartWithBuffer
      KeyC: macro:replaceToEndWithBuffer
      KeyV: null
      KeyB: macro:replaceLineWidthBuffer
      KeyN: Ctrl+Shift+ArrowLeft
      KeyM: Shift+PageDown
      Comma: Shift+PageUp
      Period: Ctrl+Shift+ArrowRight
      Slash: macro:select5LinesDown
  - id: symbols
    keys:
      KeyQ: 'text:<'
      KeyW: 'text:{'
      KeyE: 'text:['
      KeyR: 'text:('
      KeyT: 'text:|'
      KeyY: 'text:^'
      KeyU: Digit7
      KeyI: Digit8
      KeyO: Digit9
      KeyP: 'text:+'
      BracketLeft: null

      KeyA: 'text:#'
      KeyS: 'text::'
      KeyD: 'text:!'
      KeyF: 'text:?'
      KeyG: 'text:&'
      KeyH: 'text:*'
      KeyJ: Digit4
      KeyK: Digit5
      KeyL: Digit6
      Semicolon: 'text:='
      Quote: 'text:%'

      KeyZ: 'text:$'
      KeyX: 'text:`'
      KeyC: "text:'"
      KeyV: 'text:"'
      KeyB: 'text:@'
      KeyN: Digit0
      KeyM: Digit1
      Comma: Digit2
      Period: Digit3
      Slash: 'text:/'

      ShiftRight: 'text:_'
  - id: f-keys
    keys:
      KeyQ: 'text:>'
      KeyW: 'text:}'
      KeyE: 'text:]'
      KeyR: 'text:)'
      KeyT: 'text:☝️'
      KeyY: F12
      KeyU: F7
      KeyI: F8
      KeyO: F9
      KeyP: 'text:👍'
      BracketLeft: 'text:👎'

      KeyA: 'text:№'
      KeyS: 'text:;'
      KeyD: 'text:‼️'
      KeyF: 'text:❓'
      KeyG: 'text:❌'
      KeyH: F11
      KeyJ: F4
      KeyK: F5
      KeyL: F6
      Semicolon: 'text:≠'
      Quote: 'text:⚡'

      KeyZ: 'text:€'
      KeyX: 'text:~'
      KeyC: 'text:⏩'
      KeyV: 'text:✅'
      KeyB: 'text:ℹ️'
      KeyN: F10
      KeyM: F1
      Comma: F2
      Period: F3
      Slash: "text:\\"
  - id: desktop
    keys:
      F4: F4
      Tab: Tab
      Backspace: kde:org_kde_powerdevil/Turn Off Screen
      CapsLock: kde:kwin/Walk Through Windows Alternative
      #ShiftLeft: Alt+Backquote

      Digit1: Meta+Digit1
      Digit2: Meta+Digit2
      Digit3: Meta+Digit3
      Digit4: Meta+Digit4
      Digit5: Meta+Digit5
      Digit6: Meta+Digit6
      Digit7: Meta+Digit7
      Digit8: Meta+Digit8
      Digit9: Meta+Digit9
      Digit0: Meta+Digit0

      KeyQ: null
      KeyW: Ctrl+KeyA
      KeyE: null
      KeyR: null
      KeyT: kde:kwin/Window Above Other Windows
      KeyY: sys:switchLayout1
      KeyU: sys:switchLayout2
      KeyI: sys:switchLayout3
      KeyO: sys:switchLayout4
      KeyP: sys:switchLayout5
      BracketLeft: sys:switchLayout6
      BracketRight: sys:switchLayout7
      #Backslash: kde:org_kde_powerdevil/Turn Off Screen

      KeyA: sys:switchDesktop4
      KeyS: sys:switchDesktop3
      KeyD: sys:switchDesktop2
      KeyF: sys:switchDesktop1
      KeyG: kde:kwin/Window to Next Desktop
      KeyH: Meta+ArrowLeft
      KeyJ: Meta+ArrowUp
      KeyK: Meta+ArrowDown
      KeyL: Meta+ArrowRight
      Semicolon: kde:kwin/Window Maximize Vertical
      Quote: kde:kwin/Window Maximize Horizontal

      ShiftLeft: sys:switchLayout4
      KeyZ: sys:switchLayout3
      KeyX: sys:switchLayout2
      KeyC: sys:switchLayout1
      KeyV: Meta+KeyV
      # use alt+F4
      # KeyB: F4
      KeyB: PrintScreen
      KeyN: BrightnessDown
      KeyM: BrightnessUp
      Comma: AudioVolumeDown
      Period: AudioVolumeUp
      Slash: AudioVolumeMute
      ShiftRight: MicrophoneMuteToggle
rules:
  - key: Tab
    layer: select
  - key: CapsLock
    tap: Ctrl+KeyV
    layer: navigation
    holdMs: 180
  - key: ShiftLeft
    tap: Ctrl+KeyC
    dtap: Ctrl+KeyX
  - key: ShiftLeft+CapsLock
    tap: CapsLock
  - key: ControlLeft
    hold: AltLeft
    tap: app:showQuickMenu1
  - key: MetaLeft
    tap: Escape
    hold: ControlLeft
  - key: AltLeft
    tap: Enter
    layer: desktop
    hold: AltLeft
    # Lazy hold: Alt is materialised to the app only when Tab is pressed
    # (native Alt+Tab switcher). Every other win-layer key runs without Alt,
    # so language switching (KeyC/KeyX/KeyZ/ShiftLeft) never leaks a lone Alt
    # release → no more Firefox menu bar popping open.
    holdFor: Tab
  - key: AltRight
    tap: 'text:,'
    dtap: 'text:.'
    layer: symbols
  - key: ControlRight
    tap: 'text:.'
    layer: f-keys
  - key: ShiftRight
    tap: 'text:-'
macros: []
quickActionPages:
