[package]
name = "slint-shell"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
slint = { version = "=1.18.0", default-features = false, features = ["std", "accessibility", "compat-1-18", "backend-winit", "renderer-software", "renderer-femtovg", "renderer-skia", "unstable-winit-030"] }
ksni = { version = "0.3.6", features = ["blocking"] }
evdev = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

raw-window-handle = "0.6"
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[build-dependencies]
slint-build = "=1.18.0"

[profile.release]
lto = true
opt-level = "s"
strip = true
